<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>myweb</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.css" rel="stylesheet">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- 사이드바 토글 버튼 -->
  <button id="toggleSidebarBtn" class="toggle-btn">☰</button>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <img src="{{ url_for('static', filename='Teri.jpg') }}" class="profile-img" alt="프로필">
      <h2>이유정</h2>
      <p>AI 공부 중입니다. 🧠💻</p>
      <nav class="nav-links">
        <a href="/">🏠 Home</a>
        <a href="/project/lstm">📊 LSTM</a>
        <a href="/project/word2vec">🔤 Word2Vec</a>
        <a href="/project/chatbot">🤖 Chatbot</a>
        <a href="/project/board">📋 Board</a>
      </nav>
      <div class="contact">
        <p>📧 daaaaaang2@gmail.com</p>
        <p>💻 <a href="https://github.com/yujeong-lee-1996" target="_blank">GitHub</a></p>
      </div>
    </aside>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  {% include "layout/footer.html" %}

  <!-- 토글 기능 JS 연결 -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="{{ url_for('static', filename='board.js') }}"></script>
  <script src="{{ url_for('static', filename='toggle.js') }}"></script>
</body>
</html>
