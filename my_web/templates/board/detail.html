{% extends "layout/base.html" %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='board.css') }}">
{% endblock %}

{% block content %}
<div class="container mt-5 detail-post">
  <h2 class="font-weight-bold">{{ post.title }}</h2>
  <p class="text-muted">작성일: {{ post.created_at.strftime("%Y-%m-%d %H:%M") }}</p>
  <hr>
  
  <div class="post-content detail-inner">
    {{ post.content | safe }}
  </div>

  <!-- ✅ 버튼 영역 -->
  <div class="mt-4 d-flex justify-content-between">
    <a href="{{ url_for('board.board_list') }}" class="btn btn-secondary">← 목록으로</a>

    <div>
      <a href="{{ url_for('board.edit_post', post_id=post.id) }}" class="btn btn-outline-primary">✏ 수정</a>
      <form action="{{ url_for('board.delete_post', post_id=post.id) }}" method="POST" style="display:inline;" onsubmit="return confirm('정말 삭제하시겠습니까?');">
        <button type="submit" class="btn btn-outline-danger">🗑 삭제</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
