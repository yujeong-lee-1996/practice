{% extends "layout/base.html" %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='board.css') }}">
{% endblock %}

{% block content %}
<div class="container mt-5 detail-post">
    <form id="edit-form" method="post" data-post-id="{{ post.id }}">
    <div class="form-group">
      <label for="title">제목</label>
      <input type="text" id="title" name="title" class="form-control" value="{{ post.title }}" required>
    </div>

    <div class="form-group">
      <label for="content">내용</label>
      <textarea id="summernote" name="content" class="form-control summernote" rows="10">{{ post.content | safe }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary mt-3">수정 완료</button>
    <a href="{{ url_for('board.board_list') }}" class="btn btn-secondary mt-3">← 목록으로</a>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const CURRENT_MODE = 'edit';
  const POST_ID = document.getElementById('edit-form').dataset.postId;
</script>
<script src="{{ url_for('static', filename='board.js') }}"></script>
{% endblock %}
